# Guardiano notturno del cantiere — gira su GitHub, anche a Mac spento. 0 crediti IA.
# Configurazione: .cantiere/guardiano.json · Script: .cantiere/strumenti/guardiano/
name: guardiano

on:
  schedule:
    - cron: "17 1 * * *"      # ogni notte verso le 2–3 (ora italiana)
  push:
    branches: [main]
    paths-ignore: [".cantiere/DIARIO.md", ".cantiere/STATO.md", ".cantiere/CONSEGNA.md"]
  workflow_dispatch: {}        # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: read
  actions: read                # per scaricare il giro precedente (confronto visivo)

concurrency:
  group: guardiano
  cancel-in-progress: true

jobs:
  giro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache delle dipendenze del guardiano
        uses: actions/cache@v4
        with:
          path: |
            .cantiere/strumenti/guardiano/node_modules
            ~/.cache/ms-playwright
          key: guardiano-${{ hashFiles('.cantiere/strumenti/guardiano/package.json') }}

      - name: Dipendenze e browser
        working-directory: .cantiere/strumenti/guardiano
        run: |
          [ -d node_modules ] || npm install --no-audit --no-fund --loglevel=error
          npx playwright install --with-deps chromium

      - name: Scarica il giro precedente (per il confronto visivo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ultimo giro concluso (anche rosso: gli screenshot servono lo stesso)
          ID=$(gh run list --workflow guardiano.yml --status completed --limit 1 --json databaseId -q '.[0].databaseId' || true)
          [ -z "$ID" ] && exit 0
          gh run download "$ID" --name guardiano-screenshot --dir .cantiere/guardiano/precedente \
            || gh run download "$ID" --name guardiano --dir .cantiere/guardiano/precedente || true

      - name: Giro del guardiano
        id: giro
        run: bash .cantiere/strumenti/guardiano/esegui.sh

      - name: Riassunto nella pagina di GitHub
        if: always()
        run: |
          [ -f .cantiere/guardiano/ultimo/RAPPORTO.md ] && cat .cantiere/guardiano/ultimo/RAPPORTO.md >> "$GITHUB_STEP_SUMMARY" || echo "Nessun rapporto prodotto" >> "$GITHUB_STEP_SUMMARY"

      - name: Separa gli screenshot dal rapporto
        if: always()
        run: |
          mkdir -p .cantiere/guardiano/foto
          [ -d .cantiere/guardiano/ultimo/screenshot ] && mv .cantiere/guardiano/ultimo/screenshot .cantiere/guardiano/foto/ || true

      - name: Salva il rapporto (piccolo, si scarica in un attimo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardiano
          path: .cantiere/guardiano/ultimo
          retention-days: 14

      - name: Salva gli screenshot (pesanti, si scaricano solo se servono)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardiano-screenshot
          path: .cantiere/guardiano/foto
          retention-days: 14
          if-no-files-found: ignore
